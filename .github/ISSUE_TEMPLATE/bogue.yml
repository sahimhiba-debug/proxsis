name: Bogue
description: Quelque chose ne marche pas comme prévu
labels: ["bogue"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! N'incluez **aucune donnée personnelle réelle** (nom de particulier, adresse, numéro). Une faille de sécurité ou un nom de particulier visible : ne l'écrivez pas ici, voir SECURITY.md.
  - type: textarea
    id: constat
    attributes:
      label: Ce qui se passe
      description: Ce que vous voyez, et ce que vous attendiez à la place.
    validations:
      required: true
  - type: textarea
    id: reproduire
    attributes:
      label: Pour le reproduire
      description: Adresse de la page (ex. /fr/semaine/M1/), étapes, langue.
      placeholder: |
        1. Ouvrir …
        2. Cliquer sur …
    validations:
      required: true
  - type: dropdown
    id: appareil
    attributes:
      label: Appareil
      multiple: true
      options: [Ordinateur, Tablette, Téléphone, Projection]
  - type: input
    id: navigateur
    attributes:
      label: Navigateur et version
      placeholder: Safari 26, Chrome 141…
