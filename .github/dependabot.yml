version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Zurich }
    open-pull-requests-limit: 5
    groups:
      web-dev:
        dependency-type: development
        update-types: [minor, patch]
      web-prod:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /python
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Zurich }
    open-pull-requests-limit: 5
    groups:
      python:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Zurich }
    groups:
      actions:
        patterns: ["*"]
